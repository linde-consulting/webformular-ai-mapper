[project]
name = "ai-mapper"
version = "0.1.0"
description = "AI-gestützter Mapper: Webformular -> FIM-Referenzschema (XDatenfelder/XSD) + FORMCYCLE-FIT-Connect-Plugin-Template"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
